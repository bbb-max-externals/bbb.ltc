name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DBBB_LTC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: externals-macos
          path: externals/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBBB_LTC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: externals-windows
          path: externals/

  package:
    permissions:
      contents: write
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS externals
        uses: actions/download-artifact@v4
        with:
          name: externals-macos
          path: dist/bbb.ltc/externals/

      - name: Download Windows externals
        uses: actions/download-artifact@v4
        with:
          name: externals-windows
          path: dist/bbb.ltc/externals/

      - name: Assemble package
        run: |
          # Required files
          cp package-info.json dist/bbb.ltc/ 2>/dev/null || true
          cp LICENSE dist/bbb.ltc/ 2>/dev/null || true
          cp README.md dist/bbb.ltc/ 2>/dev/null || true

          # Optional directories
          cp -r help dist/bbb.ltc/ 2>/dev/null || true
          cp -r extra dist/bbb.ltc/ 2>/dev/null || true
          cp -r patchers dist/bbb.ltc/ 2>/dev/null || true

      - name: Create archive
        run: |
          cd dist
          zip -r bbb.ltc.zip bbb.ltc/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbb.ltc-latest
          path: dist/*.zip

      - name: Update latest package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="dist/bbb.ltc.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest package" --notes "Automatically updated from main at ${GITHUB_SHA}."
            gh release upload latest "$ZIP" --clobber
          else
            gh release create latest "$ZIP" --title "Latest package" --notes "Automatically updated from main at ${GITHUB_SHA}." --latest
          fi

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
